<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Control por Voz - NUI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <h1>Panel de Control por Voz</h1>
    <p id="texto">Di ordenes como: <strong>"Rojo"</strong>, <strong>"Verde"</strong>, <strong>"Azul"</strong>,
      <strong>"Más grande"</strong>, <strong>"Más pequeño"</strong>, <strong>"Modo oscuro"</strong>,
      <strong>"Modo claro"</strong> o <strong>"Restablecer"</strong>.</p>
    <button id="btnStart">Activar Micrófono</button>
    <p class="status" id="statusText">Estado: Inactivo</p>
    <p>Último comando detectado: <span id="commandText">-</span></p>
    <p>Respuesta: <span id="respuesta">-</span></p>

    <p>Si no tienes micrófono:</p>
    <button onclick="comando('rojo')">Rojo</button>
    <button onclick="comando('verde')">Verde</button>
    <button onclick="comando('azul')">Azul</button>
    <button onclick="comando('más grande')">Más grande</button>
    <button onclick="comando('más pequeño')">Más pequeño</button>
    <button onclick="comando('modo oscuro')">Modo oscuro</button>
    <button onclick="comando('modo claro')">Modo claro</button>
    <button onclick="comando('restablecer')">Restablecer</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
